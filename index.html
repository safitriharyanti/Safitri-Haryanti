<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPOS Enterprise</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0; font-family:Arial; background:#0f172a; color:white;}
.container {padding:20px;}
.card {background:#1e293b; padding:15px; border-radius:10px; margin-bottom:15px;}
input,select,button {padding:10px; width:100%; margin-top:5px;}
</style>
</head>

<body>

<div class="container">

<h2>🔐 Login</h2>
<div class="card">
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">

<h2>📊 Dashboard</h2>

<div class="card">
<p id="kpi"></p>
</div>

<canvas id="chart"></canvas>

<div class="card">
<h3>🤖 AI Insight</h3>
<p id="ai"></p>
<button onclick="getAI()">Ambil Insight</button>
</div>

<h2>🛒 Kasir</h2>
<div class="card">
<input id="produk" placeholder="Produk">
<input id="amount" placeholder="Harga">
<select id="payment">
<option>Cash</option>
<option>GoPay</option>
<option>Transfer</option>
</select>
<button onclick="order()">Tambah Order</button>
</div>

</div>

</div>

<script>

let API = "https://YOUR_BACKEND_URL";

// =====================
// LOGIN
// =====================
function login(){
if(user.value=="admin" && pass.value=="123"){
app.style.display="block";
}else{
alert("Login gagal");
}
}

// =====================
// LOAD DATA
// =====================
async function load(){
let res = await fetch(API+"/data");
let data = await res.json();

let revenue = data.reduce((a,b)=>a+b.order_amount,0);

kpi.innerText = "Revenue: "+revenue;

// chart
new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:data.map(d=>d.produk),
datasets:[{data:data.map(d=>d.order_amount)}]
}
});
}

// =====================
// ORDER (KASIR)
// =====================
async function order(){
await fetch(API+"/order",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
produk:produk.value,
amount:parseFloat(amount.value),
payment:payment.value,
province:"Jabar",
city:"Bandung"
})
});

alert("Order masuk!");
load();
}

// =====================
// AI
// =====================
async function getAI(){
let res = await fetch(API+"/ai");
let d = await res.json();
ai.innerText = d.insight;
}

// =====================
load();

</script>

</body>
</html>
